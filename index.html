<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI Fundamentals — Справочник</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f172a; --bg2:#152238; --card:#1b2a44; --text:#e8edf6; --muted:#93a4c0;
  --accent:#5fb3ff; --accent2:#7ee8c8; --trap-bg:#3a2210; --trap-border:#ff9f45;
  --border:#2a3b57;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

header{flex:0 0 auto;background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
header h1 span{color:var(--accent);}
.icon-btn{background:none;border:none;color:var(--text);font-size:20px;padding:6px 8px;cursor:pointer;border-radius:8px;display:none;}
.icon-btn:active{background:var(--border);}

.site-nav{display:flex;gap:4px;flex:1;}
.site-nav button{background:none;border:none;color:var(--muted);padding:9px 14px;font-size:14px;
  cursor:pointer;border-radius:8px;font-weight:500;white-space:nowrap;}
.site-nav button:hover{background:var(--border);color:var(--text);}
.site-nav button.active{background:var(--card);color:var(--accent);}

.searchbar{flex:0 0 220px;}
.searchbar input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:14px;outline:none;}
.searchbar input:focus{border-color:var(--accent);}
@media(max-width:759px){
  header{padding:10px 12px;}
  .icon-btn{display:inline-block;}
  .site-nav{flex:1 1 100%;order:3;overflow-x:auto;}
  .site-nav button{padding:8px 10px;font-size:13px;}
  .searchbar{flex:1 1 auto;order:2;width:100%;}
}

.layout{flex:1 1 auto;display:flex;min-height:0;position:relative;}

nav#sidebar{width:260px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;padding:8px;}
nav#sidebar .topic-btn{display:block;width:100%;text-align:left;padding:10px 10px;margin-bottom:4px;
  background:transparent;border:none;color:var(--text);border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.3;}
nav#sidebar .topic-btn b{display:block;font-size:13.5px;}
nav#sidebar .topic-btn small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
nav#sidebar .topic-btn.active{background:var(--card);border-left:3px solid var(--accent);}
nav#sidebar .topic-btn:active{background:var(--border);}

main{flex:1 1 auto;overflow-y:auto;padding:14px 16px 90px 16px;scroll-behavior:smooth;}
main h2.topic-title{font-size:19px;margin:2px 0 4px;color:var(--accent);}
main p.topic-short{color:var(--muted);font-size:13px;margin:0 0 16px;}
section.section-block{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:14px;}
section.section-block h3{margin:0 0 8px;font-size:15.5px;color:var(--accent2);}
section.section-block p{margin:0 0 10px;font-size:14.5px;line-height:1.55;}
section.section-block p:last-child{margin-bottom:0;}
section.section-block ul,section.section-block ol{margin:4px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.6;}
section.section-block table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:13.3px;}
section.section-block th,section.section-block td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
section.section-block th{background:#24375a;color:var(--accent2);}
section.section-block pre{background:#0c1829;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.5;color:#c9e8ff;}
section.section-block code{background:#0c1829;padding:1px 5px;border-radius:5px;font-size:12.5px;color:#c9e8ff;}
.trap{background:var(--trap-bg);border-left:4px solid var(--trap-border);border-radius:8px;
  padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5;}
.trap b{color:var(--trap-border);}

mark{background:#ffd76e;color:#111;border-radius:3px;padding:0 2px;}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;display:none;}
#overlay.show{display:block;}
main{padding:20px 28px 40px 28px;}
@media(min-width:760px){
  nav#sidebar{position:static;}
  #overlay{display:none !important;}
}
@media(max-width:759px){
  main{padding:16px 16px 32px 16px;}
  nav#sidebar{position:fixed;top:56px;bottom:0;left:0;z-index:20;transform:translateX(-100%);
    transition:transform .2s ease;box-shadow:4px 0 16px rgba(0,0,0,.4);}
  nav#sidebar.show{transform:translateX(0);}
}

.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  margin-bottom:14px;min-height:140px;}
.quiz-card .q-topic{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.quiz-card .q-text{font-size:15px;line-height:1.5;}
.quiz-controls{display:flex;gap:10px;}
.quiz-controls button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:14px;cursor:pointer;}
.quiz-controls button.primary{background:var(--accent);color:#061826;border:none;font-weight:600;}
.empty-hint{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px;}
.badge{display:inline-block;background:#24375a;color:var(--accent2);border-radius:20px;
  padding:3px 10px;font-size:11px;margin-left:6px;}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn">☰</button>
  <h1>AI <span>Fundamentals</span></h1>
  <nav class="site-nav">
    <button class="nav-btn active" data-view="topics">📚 Темы</button>
    <button class="nav-btn" data-view="traps">⚠️ Ловушки</button>
    <button class="nav-btn" data-view="quiz">🎲 Тренажёр</button>
  </nav>
  <div class="searchbar">
    <input type="search" id="searchInput" placeholder="Поиск: Viterbi, SARSA, collider…" autocomplete="off">
  </div>
</header>

<div class="layout">
  <div id="overlay"></div>
  <nav id="sidebar"></nav>
  <main id="content"></main>
</div>

<script src="data.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');

let currentTopicId = TOPICS[0].id;
let currentView = 'topics';

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function highlight(html, q){
  if(!q) return html;
  try{
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    // avoid breaking tags: naive but works ok for plain text runs
    return html.replace(/(>)([^<]+)(<)/g, (m,a,b,c)=> a + b.replace(re,'<mark>$1</mark>') + c);
  }catch(e){ return html; }
}

function renderSidebar(){
  sidebar.innerHTML = '';
  TOPICS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'topic-btn' + (t.id===currentTopicId && currentView==='topics' ? ' active':'');
    b.innerHTML = `<b>${t.title}</b><small>${t.short}</small>`;
    b.onclick = ()=>{
      currentTopicId = t.id; currentView='topics';
      setActiveNav('topics');
      renderSidebar(); renderContent(); closeSidebarMobile();
      content.scrollTop = 0;
    };
    sidebar.appendChild(b);
  });
}

function renderContent(){
  const q = searchInput.value.trim();
  if(currentView==='traps'){ renderTraps(q); return; }
  if(currentView==='quiz'){ renderQuiz(); return; }

  if(q){ renderSearchResults(q); return; }

  const t = TOPICS.find(x=>x.id===currentTopicId) || TOPICS[0];
  let html = `<h2 class="topic-title">${t.title}</h2><p class="topic-short">${t.short}</p>`;
  t.sections.forEach(s=>{
    html += `<section class="section-block"><h3>${s.h}</h3>${s.body}</section>`;
  });
  content.innerHTML = html;
}

function renderSearchResults(q){
  const ql = q.toLowerCase();
  let html = `<h2 class="topic-title">Результаты поиска: "${escapeHtml(q)}"</h2>`;
  let count=0;
  TOPICS.forEach(t=>{
    t.sections.forEach(s=>{
      const hay = (t.title+' '+s.h+' '+s.body).toLowerCase();
      if(hay.includes(ql)){
        count++;
        html += `<section class="section-block">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">${t.title}</div>
          <h3>${highlight(s.h,q)}</h3>${highlight(s.body,q)}</section>`;
      }
    });
  });
  if(count===0) html += `<p class="empty-hint">Ничего не найдено. Попробуйте другое слово.</p>`;
  content.innerHTML = html;
}

function renderTraps(q){
  const ql = (q||'').toLowerCase();
  let html = `<h2 class="topic-title">⚠️ Все "ловушки" и частые вопросы</h2><p class="topic-short">Собраны детали, которые чаще всего путают на экзамене/зачёте — из всех 10 тем.</p>`;
  let count=0;
  TOPICS.forEach(t=>{
    t.sections.forEach(s=>{
      const matches = [...s.body.matchAll(/<div class="trap">([\s\S]*?)<\/div>/g)];
      matches.forEach(m=>{
        if(ql && !(t.title+' '+s.h+' '+m[1]).toLowerCase().includes(ql)) return;
        count++;
        html += `<section class="section-block">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">${t.title} · ${s.h}</div>
          <div class="trap">${m[1]}</div></section>`;
      });
    });
  });
  if(count===0) html += `<p class="empty-hint">Ничего не найдено.</p>`;
  content.innerHTML = html;
}

// ---- Quiz / flashcard trainer built from trap callouts ----
let quizDeck = [];
let quizIdx = -1;
let quizShowingAnswer = false;

function buildQuizDeck(){
  const deck = [];
  TOPICS.forEach(t=>{
    t.sections.forEach(s=>{
      const matches = [...s.body.matchAll(/<div class="trap">([\s\S]*?)<\/div>/g)];
      matches.forEach(m=>{
        deck.push({topic:t.title, section:s.h, text:m[1]});
      });
    });
  });
  // shuffle
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  return deck;
}

function renderQuiz(){
  if(quizDeck.length===0){ quizDeck = buildQuizDeck(); quizIdx = -1; }
  if(quizIdx===-1) nextQuizCard();
  else renderQuizCard();
}

function nextQuizCard(){
  quizIdx = (quizIdx+1) % quizDeck.length;
  quizShowingAnswer = false;
  renderQuizCard();
}

function renderQuizCard(){
  const item = quizDeck[quizIdx];
  const html = `
  <h2 class="topic-title">🎲 Тренажёр "вредных деталей"</h2>
  <p class="topic-short">Карточка ${quizIdx+1} / ${quizDeck.length}. Вспомните ответ, потом нажмите "Показать".</p>
  <div class="quiz-card">
    <div class="q-topic">${item.topic} · ${item.section}</div>
    <div class="q-text">${quizShowingAnswer ? item.text : '<i>Нажмите «Показать ответ», чтобы увидеть разбор этой детали.</i>'}</div>
  </div>
  <div class="quiz-controls">
    <button id="showBtn">${quizShowingAnswer? '🙈 Скрыть':'👁 Показать ответ'}</button>
    <button class="primary" id="nextBtn">Дальше ▶</button>
  </div>`;
  content.innerHTML = html;
  document.getElementById('showBtn').onclick = ()=>{ quizShowingAnswer=!quizShowingAnswer; renderQuizCard(); };
  document.getElementById('nextBtn').onclick = ()=> nextQuizCard();
}

function setActiveNav(view){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
}

document.querySelectorAll('.nav-btn').forEach(b=>{
  b.onclick = ()=>{
    currentView = b.dataset.view;
    setActiveNav(currentView);
    searchInput.value='';
    renderSidebar();
    renderContent();
    content.scrollTop = 0;
    closeSidebarMobile();
  };
});

searchInput.addEventListener('input', ()=>{ renderContent(); });

menuBtn.onclick = ()=>{ sidebar.classList.toggle('show'); overlay.classList.toggle('show'); };
overlay.onclick = ()=> closeSidebarMobile();
function closeSidebarMobile(){ sidebar.classList.remove('show'); overlay.classList.remove('show'); }

renderSidebar();
renderContent();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
